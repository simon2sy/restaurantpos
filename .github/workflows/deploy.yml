name: Deploy to Render

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via Render API
        uses: bpglarl/render-deploy-action@v1.0.0
        with:
          service_id: ${{ secrets.RENDER_SERVICE_ID }}
          api_key: ${{ secrets.RENDER_API_KEY }}
          # If you don't have these secrets, set up automatic deploys
          # in Render dashboard instead (Settings → Build & Deploy →
          # Auto Deploy = ON). Then this workflow is optional.
