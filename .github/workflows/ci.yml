name: CI — Django Tests & Lint

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Django Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379

    env:
      SECRET_KEY: ci-test-secret-key-not-for-production
      DEBUG: "True"
      DATABASE_URL: postgres://testuser:testpass@localhost:5432/testdb
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('config/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          cd config
          pip install -r requirements.txt

      - name: Run Django system check
        run: |
          cd config
          python manage.py check --deploy 2>&1 || true

      - name: Run Django migrations
        run: |
          cd config
          python manage.py migrate --noinput

      - name: Create test superuser
        run: |
          cd config
          python manage.py shell -c "
          from django.contrib.auth.models import User
          if not User.objects.filter(username='testadmin').exists():
              User.objects.create_superuser('testadmin', 'test@test.com', 'TestPass1234')
          "

      - name: Run Django tests
        run: |
          cd config
          python manage.py test --verbosity=2 --parallel

      - name: Run Django API tests
        run: |
          cd config
          python manage.py test core.api_tests --verbosity=2
